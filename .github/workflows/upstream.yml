name: Upstream documentation drift

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - name: Compare complete technology and HIG catalogs
        run: python scripts/docs.py catalogs --output "${{ runner.temp }}/catalog-report.json"
      - name: Check bounded source snapshots
        if: always()
        run: python scripts/docs.py sources --catalogs-only --max-urls 100 --output "${{ runner.temp }}/source-report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: upstream-reports
          path: |
            ${{ runner.temp }}/catalog-report.json
            ${{ runner.temp }}/source-report.json
          if-no-files-found: error
